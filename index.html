<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Highway - Simulator 3D</title>
    <meta name="description" content="An immersive 3D highway driving simulator with realistic car tilt physics and glossy arcade graphics.">
    
    <!-- Standard Web App Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #0b0f19;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 75vh !important;
            background: linear-gradient(to bottom, #1a1c29, #0d3b66);
            border-bottom: 4px solid #ff007f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        #controls {
            width: 100%;
            height: 22vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            background: #080a10;
            border-top: 2px solid #1f293d;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn {
            flex: 0 0 46%;
            height: 80%;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 120, 255, 0.2));
            border: 2px solid #00d4ff;
            border-radius: 16px;
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn:active {
            background: rgba(0, 212, 255, 0.4);
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <button id="leftBtn" class="btn">◀ STEER</button>
            <button id="rightBtn" class="btn">STEER ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let highScore = localStorage.getItem('turboSimHighScore') || 0;
        let gameSpeed = 6;
        let isPlaying = true;

        const horizonY = 210;
        const roadBottomWidth = 380;
        const roadTopWidth = 70;
        
        let playerLane = 0; 
        let currentLaneOffset = 0;
        let carTilt = 0; // Physics tilt angle when turning

        let obstacles = [];
        let roadOffset = 0;

        // --- Web Audio API Engine Sound ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

        // Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        function moveLeft(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane > -1) {
                playerLane--;
                playSound('move');
            }
        }

        function moveRight(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane < 1) {
                playerLane++;
                playSound('move');
            }
        }

        leftBtn.addEventListener('touchstart', moveLeft);
        rightBtn.addEventListener('touchstart', moveRight);
        leftBtn.addEventListener('mousedown', moveLeft);
        rightBtn.addEventListener('mousedown', moveRight);

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        function spawnObstacle() {
            const lanes = [-1, 0, 1];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            // Realistic car colors (Metallic red, dark silver, deep blue, gold)
            const colorThemes = [
                { primary: '#d90429', highlight: '#ff4d6d' },
                { primary: '#2b2d42', highlight: '#8d99ae' },
                { primary: '#3a86ff', highlight: '#8ecae6' },
                { primary: '#ffb703', highlight: '#ffdda1' }
            ];
            const theme = colorThemes[Math.floor(Math.random() * colorThemes.length)];
            obstacles.push({
                lane: randomLane,
                z: 1.0,
                theme: theme
            });
        }

        let spawnTimer = 0;

        // --- Realistic 3D Simulator Car Renderer with Glossy Gradient & Tilt ---
        function drawCar(x, y, w, h, theme, tiltAngle = 0, isPlayer = false) {
            ctx.save();
            ctx.translate(x + w / 2, y - h / 2);
            ctx.rotate(tiltAngle); // Apply steering tilt physics

            let halfW = w / 2;
            let halfH = h / 2;

            // 1. Drop Shadow underneath for realism
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, halfH - 2, halfW * 0.9, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. Realistic Tires
            ctx.fillStyle = '#111';
            ctx.fillRect(-halfW - 3, -halfH * 0.5, 6, halfH * 0.5);
            ctx.fillRect(halfW - 3, -halfH * 0.5, 6, halfH * 0.5);
            ctx.fillRect(-halfW - 3, halfH * 0.1, 6, halfH * 0.5);
            ctx.fillRect(halfW - 3, halfH * 0.1, 6, halfH * 0.5);

            // 3. Glossy Metallic Body Gradient
            let bodyGrad = ctx.createLinearGradient(-halfW, -halfH, halfW, halfH);
            bodyGrad.addColorStop(0, theme.highlight);
            bodyGrad.addColorStop(0.5, theme.primary);
            bodyGrad.addColorStop(1, '#050505');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(-halfW * 0.7, -halfH);
            ctx.lineTo(halfW * 0.7, -halfH);
            ctx.lineTo(halfW * 0.95, -halfH * 0.3);
            ctx.lineTo(halfW, halfH * 0.8);
            ctx.lineTo(-halfW, halfH * 0.8);
            ctx.lineTo(-halfW * 0.95, -halfH * 0.3);
            ctx.closePath();
            ctx.fill();

            // 4. Cockpit Roof & Windows
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(-halfW * 0.6, -halfH * 0.4, halfW * 1.2, halfH * 0.9, 4);
            ctx.fill();

            // Windshield Glass Highlight
            ctx.fillStyle = '#e0f7fc';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.moveTo(-halfW * 0.5, -halfH * 0.35);
            ctx.lineTo(halfW * 0.5, -halfH * 0.35);
            ctx.lineTo(halfW * 0.6, -halfH * 0.05);
            ctx.lineTo(-halfW * 0.6, -halfH * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // 5. Lights
            if (isPlayer) {
                // Bright Headlights
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 12;
                ctx.fillRect(-halfW * 0.7, -halfH - 2, 8, 4);
                ctx.fillRect(halfW * 0.7 - 8, -halfH - 2, 8, 4);
                ctx.shadowBlur = 0;
            } else {
                // Realistic Glowing Taillights
                ctx.fillStyle = '#ff0033';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 10;
                ctx.fillRect(-halfW * 0.8, halfH * 0.7, 10, 5);
                ctx.fillRect(halfW * 0.8 - 10, halfH * 0.7, 10, 5);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function update() {
            if (!isPlaying) return;

            let targetOffset = playerLane * 85;
            let diff = targetOffset - currentLaneOffset;
            currentLaneOffset += diff * 0.2;
            
            // Calculate smooth steering tilt based on movement direction
            carTilt += ((diff * 0.003) - carTilt) * 0.15;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let centerX = canvas.width / 2;

            // --- Realistic Road Environment & Grass ---
            ctx.fillStyle = '#0e2315'; // Dark realistic grass
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            let roadTopLeft = centerX - roadTopWidth / 2;
            let roadTopRight = centerX + roadTopWidth / 2;
            let roadBottomLeft = centerX - roadBottomWidth / 2;
            let roadBottomRight = centerX + roadBottomWidth / 2;

            // Asphalt Road Surface
            ctx.fillStyle = '#212529';
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.fill();

            // Road Shoulder Striping (Red & White kerb simulator effect)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.moveTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.stroke();

            // Center Dashed Lanes
            roadOffset = (roadOffset + gameSpeed * 1.2) % 50;
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 30]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // --- Obstacles ---
            spawnTimer++;
            if (spawnTimer > 55) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z -= gameSpeed * 0.0032;

                if (obs.z <= 0.05) {
                    obstacles.splice(i, 1);
                    score += 15;
                    playSound('score');
                    if (score % 60 === 0) gameSpeed += 0.4;
                    continue;
                }

                let scale = 1 / obs.z;
                let obsY = horizonY + (canvas.height - horizonY) * (1 - obs.z);
                let roadWidthAtZ = roadTopWidth + (roadBottomWidth - roadTopWidth) * (1 - obs.z);
                let laneWidthAtZ = roadWidthAtZ / 3;
                let obsX = centerX + (obs.lane * laneWidthAtZ) - (laneWidthAtZ * 0.35);

                let w = 80 * scale;
                let h = 90 * scale;

                drawCar(obsX, obsY, w, h, obs.theme, 0, false);

                // Collision detection box
                if (obs.z < 0.22 && obs.z > 0.08) {
                    if (obs.lane === playerLane) {
                        playSound('crash');
                        triggerGameOver();
                        return;
                    }
                }
            }

            // --- Player Car (Simulator POV) ---
            let pWidth = 110;
            let pHeight = 120;
            let pX = centerX - pWidth / 2 + currentLaneOffset;
            let pY = canvas.height - 110;

            let playerTheme = { primary: '#00b4d8', highlight: '#90e0ef' };
            drawCar(pX, pY, pWidth, pHeight, playerTheme, carTilt, true);

            // --- Simulator HUD ---
            ctx.fillStyle = 'rgba(10, 15, 25, 0.8)';
            ctx.fillRect(15, 15, 160, 65);
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(15, 15, 160, 65);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 28, 40);
            ctx.fillStyle = '#00d4ff';
            ctx.font = '14px sans-serif';
            ctx.fillText(`HIGH: ${highScore}`, 28, 65);

            requestAnimationFrame(update);
        }

        function triggerGameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('turboSimHighScore', highScore);
            }

            ctx.fillStyle = 'rgba(5, 8, 15, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 40);

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 5);

            ctx.fillStyle = '#00d4ff';
            ctx.font = '16px sans-serif';
            ctx.fillText('Tap to Restart Simulation', canvas.width / 2, canvas.height / 2 + 55);

            leftBtn.onclick = restartGame;
            rightBtn.onclick = restartGame;
        }

        function restartGame() {
            initAudio();
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            playerLane = 0;
            currentLaneOffset = 0;
            carTilt = 0;
            isPlaying = true;

            leftBtn.onclick = null;
            rightBtn.onclick = null;
            leftBtn.addEventListener('touchstart', moveLeft);
            rightBtn.addEventListener('touchstart', moveRight);
            leftBtn.addEventListener('mousedown', moveLeft);
            rightBtn.addEventListener('mousedown', moveRight);

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
