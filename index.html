<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Highway - 3D Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #05020a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 75vh !important;
            background: linear-gradient(to bottom, #000428, #004e92);
            border-bottom: 4px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
        }
        #controls {
            width: 100%;
            height: 22vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            background: #000;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn {
            flex: 0 0 46%;
            height: 80%;
            background: rgba(0, 255, 255, 0.08);
            border: 3px solid #00ffff;
            border-radius: 16px;
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.35);
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <button id="leftBtn" class="btn">◀ LEFT</button>
            <button id="rightBtn" class="btn">RIGHT ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let highScore = localStorage.getItem('turboHighScore') || 0;
        let gameSpeed = 5;
        let isPlaying = true;

        const horizonY = 200;
        const roadBottomWidth = 360;
        const roadTopWidth = 60;
        
        let playerLane = 0; 
        let currentLaneOffset = 0;

        let obstacles = [];
        let roadOffset = 0;

        // --- Web Audio API Sound Generator ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        // Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        function moveLeft(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane > -1) {
                playerLane--;
                playSound('move');
            }
        }

        function moveRight(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane < 1) {
                playerLane++;
                playSound('move');
            }
        }

        leftBtn.addEventListener('touchstart', moveLeft);
        rightBtn.addEventListener('touchstart', moveRight);
        leftBtn.addEventListener('mousedown', moveLeft);
        rightBtn.addEventListener('mousedown', moveRight);

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        function spawnObstacle() {
            const lanes = [-1, 0, 1];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            const colors = ['#ff0055', '#ff9900', '#9900ff', '#00ffcc'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            obstacles.push({
                lane: randomLane,
                z: 1.0,
                color: randomColor
            });
        }

        let spawnTimer = 0;

        // --- Detailed Procedural Car Drawing Function ---
        function drawCar(x, y, w, h, primaryColor, isPlayer = false) {
            ctx.save();

            // Tires
            ctx.fillStyle = '#000000';
            ctx.fillRect(x - w * 0.08, y - h * 0.7, w * 0.12, h * 0.4);
            ctx.fillRect(x + w * 0.96, y - h * 0.7, w * 0.12, h * 0.4);
            ctx.fillRect(x - w * 0.08, y - h * 0.2, w * 0.12, h * 0.4);
            ctx.fillRect(x + w * 0.96, y - h * 0.2, w * 0.12, h * 0.4);

            // Main Car Body (Chassis)
            ctx.fillStyle = primaryColor;
            ctx.beginPath();
            ctx.roundRect(x, y - h, w, h, [8, 8, 4, 4]);
            ctx.fill();

            // Roof / Cabin
            ctx.fillStyle = isPlayer ? '#002233' : '#111111';
            ctx.beginPath();
            ctx.roundRect(x + w * 0.15, y - h * 0.75, w * 0.7, h * 0.5, [6, 6, 2, 2]);
            ctx.fill();

            // Windshield & Rear Window
            ctx.fillStyle = '#88ffff';
            ctx.globalAlpha = 0.8;
            // Front windshield
            ctx.fillRect(x + w * 0.2, y - h * 0.7, w * 0.6, h * 0.22);
            // Rear window
            ctx.fillRect(x + w * 0.2, y - h * 0.38, w * 0.6, h * 0.12);
            ctx.globalAlpha = 1.0;

            // Headlights / Taillights glow
            if (isPlayer) {
                // Bright Cyan Headlights
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w * 0.1, y - h * 0.15, w * 0.2, h * 0.1);
                ctx.fillRect(x + w * 0.7, y - h * 0.15, w * 0.2, h * 0.1);
            } else {
                // Glowing Red Taillights
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 8;
                ctx.fillRect(x + w * 0.1, y - h * 0.15, w * 0.2, h * 0.1);
                ctx.fillRect(x + w * 0.7, y - h * 0.15, w * 0.2, h * 0.1);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function update() {
            if (!isPlaying) return;

            let targetOffset = playerLane * 75;
            currentLaneOffset += (targetOffset - currentLaneOffset) * 0.2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- Draw Road & Environment ---
            let centerX = canvas.width / 2;

            ctx.fillStyle = '#111a11';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            let roadTopLeft = centerX - roadTopWidth / 2;
            let roadTopRight = centerX + roadTopWidth / 2;
            let roadBottomLeft = centerX - roadBottomWidth / 2;
            let roadBottomRight = centerX + roadBottomWidth / 2;

            ctx.fillStyle = '#1b1b22';
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.fill();

            // Neon Borders
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.moveTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.stroke();

            // Center dashes
            roadOffset = (roadOffset + gameSpeed * 0.8) % 40;
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 3;
            ctx.setLineDash([15, 25]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // --- Obstacles ---
            spawnTimer++;
            if (spawnTimer > 60) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z -= gameSpeed * 0.0035;

                if (obs.z <= 0.05) {
                    obstacles.splice(i, 1);
                    score += 10;
                    playSound('score');
                    if (score % 50 === 0) gameSpeed += 0.5;
                    continue;
                }

                let scale = 1 / obs.z;
                let obsY = horizonY + (canvas.height - horizonY) * (1 - obs.z);
                let roadWidthAtZ = roadTopWidth + (roadBottomWidth - roadTopWidth) * (1 - obs.z);
                let laneWidthAtZ = roadWidthAtZ / 3;
                let obsX = centerX + (obs.lane * laneWidthAtZ) - (laneWidthAtZ * 0.3);

                let w = 70 * scale;
                let h = 45 * scale;

                // Draw Detailed Traffic Car
                drawCar(obsX, obsY, w, h, obs.color, false);

                // Collision Check
                if (obs.z < 0.22 && obs.z > 0.08) {
                    if (obs.lane === playerLane) {
                        playSound('crash');
                        triggerGameOver();
                        return;
                    }
                }
            }

            // --- Player Car ---
            let pWidth = 110;
            let pHeight = 70;
            let pX = centerX - pWidth / 2 + currentLaneOffset;
            let pY = canvas.height - 85;

            // Neon glow for player
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 18;
            drawCar(pX, pY, pWidth, pHeight, '#00ffff', true);
            ctx.shadowBlur = 0;

            // --- HUD ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 35);
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '14px sans-serif';
            ctx.fillText(`HIGH: ${highScore}`, 20, 60);

            requestAnimationFrame(update);
        }

        function triggerGameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('turboHighScore', highScore);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff00ff';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = '#ffffff';
            ctx.font = '22px sans-serif';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);

            ctx.fillStyle = '#00ffff';
            ctx.font = '18px sans-serif';
            ctx.fillText('Tap buttons to Restart', canvas.width / 2, canvas.height / 2 + 65);

            leftBtn.onclick = restartGame;
            rightBtn.onclick = restartGame;
        }

        function restartGame() {
            initAudio();
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            playerLane = 0;
            currentLaneOffset = 0;
            isPlaying = true;

            leftBtn.onclick = null;
            rightBtn.onclick = null;
            leftBtn.addEventListener('touchstart', moveLeft);
            rightBtn.addEventListener('touchstart', moveRight);
            leftBtn.addEventListener('mousedown', moveLeft);
            rightBtn.addEventListener('mousedown', moveRight);

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
