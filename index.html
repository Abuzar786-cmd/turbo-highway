<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Traffic Rider 3D - Moto Highway</title>
    <meta name="description" content="A high-speed 3D motorcycle highway rider with background music, dynamic bike leaning, and synth audio.">
    
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #05020a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 75vh !important;
            background: linear-gradient(to bottom, #03001e, #7303c0, #ec38bc, #fdeff9);
            border-bottom: 4px solid #00f2fe;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }
        #controls {
            width: 100%;
            height: 22vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            background: #06060c;
            border-top: 2px solid #1a1a2e;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn {
            flex: 0 0 46%;
            height: 80%;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.3));
            border: 2px solid #00f2fe;
            border-radius: 16px;
            color: #00f2fe;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn:active {
            background: rgba(0, 242, 254, 0.5);
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.9);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <button id="leftBtn" class="btn">◀ LEAN LEFT</button>
            <button id="rightBtn" class="btn">LEAN RIGHT ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let highScore = localStorage.getItem('motoRiderHighScore') || 0;
        let gameSpeed = 7;
        let isPlaying = true;

        const horizonY = 220;
        const roadBottomWidth = 420;
        const roadTopWidth = 50;
        
        let playerLane = 0; 
        let currentLaneOffset = 0;
        let bikeLean = 0;

        let obstacles = [];
        let roadOffset = 0;

        // --- Web Audio API Synth Engine & Background Music ---
        let audioCtx = null;
        let bgMusicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBackgroundMusic();
            }
        }

        // Procedural Synthwave Background Music Loop
        function startBackgroundMusic() {
            if (bgMusicInterval) return;
            const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 164.81, 146.83]; // A2 bassline
            let noteIdx = 0;

            bgMusicInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = bassNotes[noteIdx % bassNotes.length];

                    let now = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.25);
                    noteIdx++;
                } catch(e) {}
            }, 250);
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'lean') {
                    // Engine rev shift
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(360, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'pass') {
                    // Flashy point chime
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'crash') {
                    // Heavy crash sound
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.6);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

        // Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        function moveLeft(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane > -1) {
                playerLane--;
                playSound('lean');
            }
        }

        function moveRight(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane < 1) {
                playerLane++;
                playSound('lean');
            }
        }

        leftBtn.addEventListener('touchstart', moveLeft);
        rightBtn.addEventListener('touchstart', moveRight);
        leftBtn.addEventListener('mousedown', moveLeft);
        rightBtn.addEventListener('mousedown', moveRight);

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        function spawnObstacle() {
            const lanes = [-1, 0, 1];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            const colors = ['#ff0055', '#ff9900', '#00f2fe', '#9900ff'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            obstacles.push({
                lane: randomLane,
                z: 1.0,
                color: randomColor
            });
        }

        let spawnTimer = 0;

        // --- Traffic Rider Motorcycle Cockpit View ---
        function drawPlayerBike(x, y, lean) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(lean);

            // Handlebars Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-70, 15, 140, 10);

            // Handlebar Grips
            ctx.fillStyle = '#111';
            ctx.fillRect(-85, 5, 25, 18);
            ctx.fillRect(60, 5, 25, 18);

            // Metallic Handlebar Tubes
            ctx.strokeStyle = '#8d99ae';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-75, 12);
            ctx.lineTo(-20, 35);
            ctx.lineTo(20, 35);
            ctx.lineTo(75, 12);
            ctx.stroke();

            // Side Mirrors
            ctx.fillStyle = '#00f2fe';
            ctx.beginPath();
            ctx.ellipse(-90, -10, 12, 6, -0.2, 0, Math.PI * 2);
            ctx.ellipse(90, -10, 12, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Digital Speedometer Display
            ctx.fillStyle = '#060a12';
            ctx.fillRect(-22, 20, 44, 25);
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.strokeRect(-22, 20, 44, 25);

            ctx.fillStyle = '#00f2fe';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.floor(gameSpeed * 18)}`, 0, 37);

            // Front Windscreen / Meter Visor
            ctx.fillStyle = 'rgba(255, 0, 128, 0.7)';
            ctx.beginPath();
            ctx.moveTo(-25, 20);
            ctx.lineTo(0, -15);
            ctx.lineTo(25, 20);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Traffic Car Renderer
        function drawTrafficCar(x, y, w, h, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y - h, w, h, 6);
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#111';
            ctx.fillRect(x + w * 0.15, y - h * 0.8, w * 0.7, h * 0.25);

            // Taillights
            ctx.fillStyle = '#ff0033';
            ctx.shadowColor = '#ff0033';
            ctx.shadowBlur = 8;
            ctx.fillRect(x + w * 0.1, y - h * 0.1, w * 0.2, h * 0.08);
            ctx.fillRect(x + w * 0.7, y - h * 0.1, w * 0.2, h * 0.08);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function update() {
            if (!isPlaying) return;

            let targetOffset = playerLane * 90;
            let diff = targetOffset - currentLaneOffset;
            currentLaneOffset += diff * 0.22;
            
            // Dynamic Moto Leaning Angle
            bikeLean += ((diff * 0.004) - bikeLean) * 0.18;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let centerX = canvas.width / 2;

            // --- Horizon Grid / Sunset Effect ---
            ctx.fillStyle = '#05020a';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            let roadTopLeft = centerX - roadTopWidth / 2;
            let roadTopRight = centerX + roadTopWidth / 2;
            let roadBottomLeft = centerX - roadBottomWidth / 2;
            let roadBottomRight = centerX + roadBottomWidth / 2;

            // Highway Track
            ctx.fillStyle = '#181528';
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.fill();

            // Neon Glowing Highway Borders
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.moveTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Center Lane Dashes
            roadOffset = (roadOffset + gameSpeed * 1.5) % 50;
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 30]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // --- Traffic Obstacles ---
            spawnTimer++;
            if (spawnTimer > 50) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z -= gameSpeed * 0.0038;

                if (obs.z <= 0.05) {
                    obstacles.splice(i, 1);
                    score += 20;
                    playSound('pass');
                    if (score % 100 === 0) gameSpeed += 0.5;
                    continue;
                }

                let scale = 1 / obs.z;
                let obsY = horizonY + (canvas.height - horizonY) * (1 - obs.z);
                let roadWidthAtZ = roadTopWidth + (roadBottomWidth - roadTopWidth) * (1 - obs.z);
                let laneWidthAtZ = roadWidthAtZ / 3;
                let obsX = centerX + (obs.lane * laneWidthAtZ) - (laneWidthAtZ * 0.35);

                let w = 75 * scale;
                let h = 55 * scale;

                drawTrafficCar(obsX, obsY, w, h, obs.color);

                // Precise Moto Collision Check
                if (obs.z < 0.20 && obs.z > 0.07) {
                    if (obs.lane === playerLane) {
                        playSound('crash');
                        triggerGameOver();
                        return;
                    }
                }
            }

            // --- Player Motorcycle Handlebars ---
            let pX = centerX + currentLaneOffset;
            let pY = canvas.height - 70;
            drawPlayerBike(pX, pY, bikeLean);

            // --- Traffic Rider HUD ---
            ctx.fillStyle = 'rgba(5, 5, 15, 0.85)';
            ctx.fillRect(15, 15, 170, 60);
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.strokeRect(15, 15, 170, 60);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 25, 38);
            ctx.fillStyle = '#ff007f';
            ctx.font = '13px sans-serif';
            ctx.fillText(`HIGH: ${highScore}`, 25, 60);

            requestAnimationFrame(update);
        }

        function triggerGameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('motoRiderHighScore', highScore);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 38px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`Final Distance: ${score} m`, canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = '#00f2fe';
            ctx.font = '16px sans-serif';
            ctx.fillText('Tap button to Restart', canvas.width / 2, canvas.height / 2 + 55);

            leftBtn.onclick = restartGame;
            rightBtn.onclick = restartGame;
        }

        function restartGame() {
            initAudio();
            score = 0;
            gameSpeed = 7;
            obstacles = [];
            playerLane = 0;
            currentLaneOffset = 0;
            bikeLean = 0;
            isPlaying = true;

            leftBtn.onclick = null;
            rightBtn.onclick = null;
            leftBtn.addEventListener('touchstart', moveLeft);
            rightBtn.addEventListener('touchstart', moveRight);
            leftBtn.addEventListener('mousedown', moveLeft);
            rightBtn.addEventListener('mousedown', moveRight);

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
