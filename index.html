<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Highway - 3D Retro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #05020a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 75vh !important;
            background: linear-gradient(to bottom, #000428, #004e92);
            border-bottom: 4px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
        }
        #controls {
            width: 100%;
            height: 22vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            background: #000;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn {
            flex: 0 0 46%;
            height: 80%;
            background: rgba(0, 255, 255, 0.08);
            border: 3px solid #00ffff;
            border-radius: 16px;
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.35);
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <button id="leftBtn" class="btn">◀ LEFT</button>
            <button id="rightBtn" class="btn">RIGHT ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let highScore = localStorage.getItem('turboHighScore') || 0;
        let gameSpeed = 5;
        let isPlaying = true;

        // 3D Perspective Road Setup
        const horizonY = 200; // Where the road vanishes
        const roadBottomWidth = 360;
        const roadTopWidth = 60;
        
        // 3 Lanes (-1 = Left, 0 = Center, 1 = Right)
        let playerLane = 0; 
        let targetLaneOffset = 0;
        let currentLaneOffset = 0;

        let obstacles = [];
        let roadOffset = 0; // For moving road stripes effect

        // --- Web Audio API Sound Generator (No external files needed) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play a quick retro sound effect
        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === 'move') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {
                // Audio context policy catch
            }
        }

        // Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        function moveLeft(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane > -1) {
                playerLane--;
                playSound('move');
            }
        }

        function moveRight(e) {
            if (e) e.preventDefault();
            initAudio();
            if (isPlaying && playerLane < 1) {
                playerLane++;
                playSound('move');
            }
        }

        leftBtn.addEventListener('touchstart', moveLeft);
        rightBtn.addEventListener('touchstart', moveRight);
        leftBtn.addEventListener('mousedown', moveLeft);
        rightBtn.addEventListener('mousedown', moveRight);

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        function spawnObstacle() {
            const lanes = [-1, 0, 1];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            obstacles.push({
                lane: randomLane,
                z: 1.0 // Starts far away (z goes from 1.0 down to 0.0 as it approaches)
            });
        }

        let spawnTimer = 0;

        function update() {
            if (!isPlaying) return;

            // Smoothly slide player towards target lane position
            let targetOffset = playerLane * 75;
            currentLaneOffset += (targetOffset - currentLaneOffset) * 0.2;

            // Clear Canvas (Sky gradient background)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- DRAW 3D PERSPECTIVE ROAD ---
            let centerX = canvas.width / 2;

            // Ground/Grass background
            ctx.fillStyle = '#111a11';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            // Road trapezoid
            let roadTopLeft = centerX - roadTopWidth / 2;
            let roadTopRight = centerX + roadTopWidth / 2;
            let roadBottomLeft = centerX - roadBottomWidth / 2;
            let roadBottomRight = centerX + roadBottomWidth / 2;

            ctx.fillStyle = '#1b1b22';
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.fill();

            // Neon Road Edges (Cyan borders)
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, horizonY);
            ctx.lineTo(roadBottomLeft, canvas.height);
            ctx.moveTo(roadTopRight, horizonY);
            ctx.lineTo(roadBottomRight, canvas.height);
            ctx.stroke();

            // Moving center dashed lines for speed illusion
            roadOffset = (roadOffset + gameSpeed * 0.8) % 40;
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 3;
            ctx.setLineDash([15, 25]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // reset dash

            // --- SPAWN AND UPDATE 3D OBSTACLES ---
            spawnTimer++;
            if (spawnTimer > 65) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z -= gameSpeed * 0.0035; // Move closer

                if (obs.z <= 0.05) {
                    // Passed player successfully
                    obstacles.splice(i, 1);
                    score += 10;
                    playSound('score');
                    if (score % 50 === 0) gameSpeed += 0.5;
                    continue;
                }

                // Project 3D coordinates to 2D Screen Space
                let scale = 1 / obs.z;
                let obsY = horizonY + (canvas.height - horizonY) * (1 - obs.z);
                let roadWidthAtZ = roadTopWidth + (roadBottomWidth - roadTopWidth) * (1 - obs.z);
                let laneWidthAtZ = roadWidthAtZ / 3;
                let obsX = centerX + (obs.lane * laneWidthAtZ) - (laneWidthAtZ * 0.25);

                let w = 60 * scale;
                let h = 40 * scale;

                // Draw 3D Obstacle Car (Magenta retro racer)
                ctx.fillStyle = '#ff00ff';
                ctx.fillRect(obsX, obsY - h, w, h);
                // Details
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(obsX + w * 0.1, obsY - h * 0.8, w * 0.8, h * 0.3);

                // --- COLLISION DETECTION (Player is at z ≈ 0.15) ---
                if (obs.z < 0.22 && obs.z > 0.08) {
                    if (obs.lane === playerLane) {
                        playSound('crash');
                        triggerGameOver();
                        return;
                    }
                }
            }

            // --- DRAW 3D PLAYER CAR (Bottom foreground) ---
            let pWidth = 110;
            let pHeight = 70;
            let pX = centerX - pWidth / 2 + currentLaneOffset;
            let pY = canvas.height - 90;

            // Player car body shadow/glow
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(pX, pY, pWidth, pHeight);
            ctx.shadowBlur = 0; // reset

            // Windshield & details
            ctx.fillStyle = '#050510';
            ctx.fillRect(pX + 15, pY + 12, pWidth - 30, pHeight * 0.4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(pX + 10, pY + pHeight - 12, 18, 8);
            ctx.fillRect(pX + pWidth - 28, pY + pHeight - 12, 18, 8);

            // --- HUD (Score & High Score) ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 35);
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '14px sans-serif';
            ctx.fillText(`HIGH: ${highScore}`, 20, 60);

            requestAnimationFrame(update);
        }

        function triggerGameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('turboHighScore', highScore);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff00ff';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = '#ffffff';
            ctx.font = '22px sans-serif';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);

            ctx.fillStyle = '#00ffff';
            ctx.font = '18px sans-serif';
            ctx.fillText('Tap buttons to Restart', canvas.width / 2, canvas.height / 2 + 65);

            leftBtn.onclick = restartGame;
            rightBtn.onclick = restartGame;
        }

        function restartGame() {
            initAudio();
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            playerLane = 0;
            currentLaneOffset = 0;
            isPlaying = true;

            leftBtn.onclick = null;
            rightBtn.onclick = null;
            leftBtn.addEventListener('touchstart', moveLeft);
            rightBtn.addEventListener('touchstart', moveRight);
            leftBtn.addEventListener('mousedown', moveLeft);
            rightBtn.addEventListener('mousedown', moveRight);

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
